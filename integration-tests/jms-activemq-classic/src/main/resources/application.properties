# ActiveMQ connection configured via test resource

# Named destinations with ActiveMQ queue names
quarkus.jms.destinations.xa-commit.destination=xa-commit-queue
quarkus.jms.destinations.xa-rollback.destination=xa-rollback-queue

# PostgreSQL — DevServices auto-starts a container
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.transactions=XA
