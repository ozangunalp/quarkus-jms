# Artemis DevServices (from quarkus-artemis-jms)
quarkus.artemis.devservices.enabled=true
quarkus.artemis.xa-enabled=true

# RM connector with XA transaction mode
mp.messaging.incoming.xa-input.connector=smallrye-jms
mp.messaging.incoming.xa-input.destination=xa-queue
mp.messaging.incoming.xa-input.transaction-mode=xa

# Incoming -> process -> Outgoing flow with local tx (session sharing)
mp.messaging.incoming.process-in.connector=smallrye-jms
mp.messaging.incoming.process-in.destination=process-input-queue
mp.messaging.incoming.process-in.transaction-mode=local
mp.messaging.incoming.process-in.session-mode=SESSION_TRANSACTED

mp.messaging.outgoing.process-out.connector=smallrye-jms
mp.messaging.outgoing.process-out.destination=process-output-queue

# Concurrent XA processing with @RunOnVirtualThread
mp.messaging.incoming.xa-concurrent.connector=smallrye-jms
mp.messaging.incoming.xa-concurrent.destination=xa-concurrent-queue
mp.messaging.incoming.xa-concurrent.transaction-mode=xa

# Connector XA rollback
mp.messaging.incoming.xa-rollback-input.connector=smallrye-jms
mp.messaging.incoming.xa-rollback-input.destination=xa-connector-rollback-queue
mp.messaging.incoming.xa-rollback-input.transaction-mode=xa

# PostgreSQL (DevServices auto-starts a container)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.transactions=XA
quarkus.hibernate-orm.database.generation=drop-and-create

# Transaction logging
quarkus.log.category."com.arjuna.ats.jta".min-level=TRACE
quarkus.log.category."com.arjuna.ats.arjuna".min-level=TRACE
quarkus.log.category."com.arjuna.ats.jta".level=TRACE
quarkus.log.category."com.arjuna.ats.arjuna".level=TRACE
