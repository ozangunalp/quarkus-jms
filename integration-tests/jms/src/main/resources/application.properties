# Artemis DevServices (from quarkus-artemis-jms) auto-starts broker
quarkus.artemis.devservices.enabled=true

# RM connector channel
mp.messaging.incoming.connector-channel.connector=smallrye-jms
mp.messaging.incoming.connector-channel.destination=connector-queue

# Pre-configured destination with selector
quarkus.jms.destinations.filtered-queue.selector=category = 'vip'

# Increase HTTP timeout for benchmark endpoints
quarkus.http.idle-timeout=PT120S
quarkus.http.read-timeout=PT120S

# Tracing — 100% sampling and immediate export for tests
quarkus.otel.traces.sampler.arg=1.0d
